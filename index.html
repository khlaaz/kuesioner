<style>
/* VOICE everyday research instrument: calm, clear, respectful of the respondent
   IDEA a printed field-survey booklet answered with a ballpoint pen; the item you are on is highlighted with a marker
   PICTURE the form itself: one calm column of items, answer bubbles that fill with pen ink
   COLOUR white paper, near-black ink, ballpoint blue for answers, marker yellow for the current item
   TYPE Plus Jakarta Sans (an Indonesian typeface) for everything
   LAYOUT modest title + section strip on top, one 720px column of items, sticky back/next bar at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121419);--ink:light-dark(#17181c,#eceef3);--mute:light-dark(#5b5f69,#a4a9b5);--line:light-dark(#d8dbe1,#2e323b);--soft:light-dark(#f4f5f8,#1a1d24);--pen:light-dark(#1d3fcf,#90a8ff);--penbg:light-dark(#e9eeff,#1f2747);--hl:light-dark(#fff0a0,#4d4520);--err:light-dark(#c3261f,#ff8f86)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,4vw)}
header{border-bottom:1px solid var(--line);padding:28px 0 0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-.02em;font-weight:800;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:18px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tools input{width:18px;height:18px;accent-color:var(--pen)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--mute)}
.ghost:hover{border-color:var(--pen);color:var(--pen)}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px}
.step{flex:1 0 auto;font-size:13px;color:var(--mute);padding-top:8px;border-top:4px solid var(--line);white-space:nowrap}
.step.done{border-color:var(--pen);color:var(--ink)}
.step.cur{border-color:var(--pen);color:var(--pen);font-weight:600}
main.wrap{padding-top:28px;padding-bottom:140px}
h2{font-size:24px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.intro{margin:0 0 22px;color:var(--mute);max-width:65ch}
.intro b,.remind b{color:var(--ink)}
.card{background:var(--soft);border-radius:12px;padding:18px 20px;margin-bottom:22px}
.card p{margin:0 0 10px}.card ul{margin:0 0 10px;padding-left:20px}.card p:last-child,.card ul:last-child{margin-bottom:0}
.remind{position:sticky;top:0;z-index:3;background:var(--penbg);color:var(--ink);border-radius:10px;padding:10px 14px;margin:0 0 20px;font-size:15px;box-shadow:0 0 0 6px var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin:-8px 0 18px}
.legend span b{color:var(--pen)}
.q{padding:18px 0 20px;border-top:1px solid var(--line);scroll-margin-top:70px}
.q.now .qn{background:var(--hl)}
.q.miss .ql{color:var(--err)}
.q.miss .qt::after{content:"Belum dijawab";display:block;font-size:13px;font-weight:600}
.ql{display:flex;gap:10px;margin-bottom:12px;font-weight:500}
.qn{flex:none;font-size:14px;font-weight:600;color:var(--mute);padding:1px 6px;border-radius:4px;height:fit-content;font-variant-numeric:tabular-nums}
.qt{flex:1}
.qt em{font-style:normal;font-weight:700;color:var(--pen)}
.vc{display:none;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--pen);background:var(--penbg);padding:2px 6px;border-radius:4px;height:fit-content;flex:none}
.codes .vc{display:inline-block}
.help{font-size:14px;color:var(--mute);margin:-6px 0 12px 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:46px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mute)}
.opt:hover{border-color:var(--pen)}
.opt.on{border-color:var(--pen);background:var(--penbg)}
.opt.on::before{border-color:var(--pen);background:radial-gradient(circle,var(--pen) 0 5px,transparent 6px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.s4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sc{min-height:52px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:14px;line-height:1.25}
.sc:hover{border-color:var(--pen)}
.sc.on{background:var(--pen);border-color:var(--pen);color:var(--bg);font-weight:600}
.opt97{margin-top:8px;display:flex;justify-content:flex-end}
.opt97 button{background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--mute);cursor:pointer;min-height:40px}
.opt97 button.on{border-style:solid;border-color:var(--pen);color:var(--pen);background:var(--penbg);font-weight:600}
.s9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.s9 .sc{min-height:46px;font-size:16px;font-variant-numeric:tabular-nums}
.anch{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-top:6px;font-size:13px;line-height:1.2;color:var(--mute)}
.anch span{text-align:center}
.anch .a0{grid-column:1/3;text-align:left}.anch .a2{grid-column:3}.anch .a4{grid-column:4/7}.anch .a6{grid-column:7}.anch .a8{grid-column:8/10;text-align:right}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:420px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.row3:first-child{border-top:0}
.row3.miss .rl{color:var(--err);font-weight:600}
.row3 .seg{width:min(300px,52vw)}
.row3 .sc{min-height:44px}
input[type=text],input[type=number],select{width:100%;max-width:340px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
input:focus,select:focus{border-color:var(--pen)}
.dur{display:flex;flex-wrap:wrap;gap:10px}
.dur label{display:flex;align-items:center;gap:8px}
.dur input{width:96px}
.ini{text-transform:uppercase;letter-spacing:.08em;font-weight:700;max-width:160px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pen);transition:width .3s}
.pct{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{min-height:46px;padding:10px 22px;border-radius:10px;border:1px solid var(--pen);background:var(--pen);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.sec{background:none;color:var(--pen)}
.btn[hidden],.tools[hidden]{display:none}
.btn:disabled{opacity:.6;cursor:wait}
.msg{color:var(--err);font-size:14px;font-weight:600;margin:16px 0 0}
.end{padding-top:12px}
.end h2{font-size:clamp(28px,5vw,40px);line-height:1.08}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:18px 0;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
textarea{width:100%;min-height:140px;margin-top:14px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.note{font-size:13px;color:var(--mute);margin-top:16px}
@media(max-width:560px){.anch .a2,.anch .a4,.anch .a6{display:none}.anch .a0{grid-column:1/5}.anch .a8{grid-column:6/10}.s9{gap:3px}.s9 .sc{font-size:15px;padding:8px 0}.row3{grid-template-columns:minmax(0,1fr)}.row3 .seg{width:100%}.sc{font-size:13px}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

async function send(status){
 const data={resp_id:rid(),t_mulai:A.t_mulai||'',t_selesai:A.t_selesai||''};
 if(status==='selesai'){data.durasi_detik=A.t_mulai?Math.round((new Date(A.t_selesai)-new Date(A.t_mulai))/1000):'';for(const k of VARS())data[k]=A[k]??''}
 if(status==='kriteria'){data.jk=A.jk??'';data.aktif=A.aktif??''}
 const body=JSON.stringify({token:CONFIG.TOKEN,kode:A.kode||KODE||'',versi:CONFIG.VERSI,gelombang:HASH_UJI?'uji':CONFIG.GELOMBANG,status,data,kontak:status==='selesai'&&A.wawancara===1?(A.kontak||''):''});
 const r=await fetch(CONFIG.ENDPOINT,{method:'POST',body});

async function go(d){

   for(const it of miss){document.getElementById('q-'+it.id)?.classList.add('miss');if(it.t==='grid')ASET.forEach((_,i)=>{if(A['aset'+p2(i+1)]==null)document.getElementById('q-aset'+p2(i+1))?.classList.add('miss')})}

   document.getElementById('q-'+miss[0].id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
   return;
  }
  if(cur===0&&A.consent===0){endEarly('tolak');return}
  if(PAGES[cur].sec===1&&(A.jk===2||A.aktif===0)){endEarly('kriteria');return}
  if(k===o.length-1){
   A.t_selesai=new Date().toISOString();rid();save();
   if(LIVE){
    const nb=document.getElementById('next'),m=document.getElementById('msg');
    nb.disabled=true;nb.textContent='Mengirim…';m.hidden=true;
    try{await send('selesai')}catch(e){
     nb.disabled=false;nb.textContent='Kirim lagi';m.hidden=false;
     m.textContent=e.message==='dipakai'?'Kode undangan pada link Anda sudah dipakai untuk mengirim jawaban, jadi jawaban ini tidak bisa dikirim lagi.':e.message==='kode'?'Kode undangan pada link Anda tidak dikenal. Buka kembali link pribadi dari undangan Anda.':'Jawaban belum terkirim. Periksa koneksi internet, lalu tekan Kirim lagi. Jawaban Anda tetap tersimpan di perangkat ini.';
     return;
    }
    nb.disabled=false;
   }
   A._end='selesai';save();render();return;
  }
  cur=o[k+1];
 }else if(k>0)cur=o[k-1];
 save();render();
}
